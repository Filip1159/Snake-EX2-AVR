; Snake EX2 AVR — PlatformIO Configuration
; Target: ATmega644PA @ 8 MHz, USBasp programmer
;
; Notes:
;   - Clock: 8 MHz internal RC (LFUSE=0xE2).  If an external 8 MHz crystal is
;     fitted, use LFUSE=0xF7; F_CPU stays 8000000L.
;     HFUSE=0xD7 (JTAG off, SPIEN on, EEPROM retained), EFUSE=0xFD (BOD 2.7 V).
;     See docs/hardware.md and docs/build.md.
;   - All assets live in flash; settings and high scores are in EEPROM.

[platformio]
default_envs = ATmega644PA

[env:ATmega644PA]
platform = atmelavr
board = ATmega644P
board_build.mcu = atmega644pa
board_build.f_cpu = 8000000L
framework = arduino
upload_protocol = usbasp
build_flags =
    -Os
    -flto
    -ffunction-sections
    -fdata-sections
    -fno-exceptions
    -fno-rtti
    -fno-threadsafe-statics
    -Wl,--gc-sections
    -I src
