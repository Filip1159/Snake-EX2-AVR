; Snake EX2 AVR — PlatformIO Configuration
; Target: ATmega644PA @ 8 MHz, USBasp programmer
;
; The ATmega32 target was retired on 2026-10-24 (D11): the G8 image used 30,958
; of 32,768 B with menus/tutorial still ahead. The ATmega644P/PA is a DIP-40
; drop-in with the same pinout, 64 KB flash and 4 KB SRAM. The actual chip is an
; ATmega644PA (signature 0x1E960A); the 644P/PA share the same signature and
; register map.
;
; BUILD NOTES (BACKLOG.MD §6, Appendix D):
;   - Keep framework = arduino during bring-up (M1/M2).
;   - Switch to framework = (empty) bare-metal avr-libc before the game engine grows (M3+).
;   - Build flags apply -Os -flto for size; -fno-rtti/exceptions for C++.
;   - Upload: USBasp. Set upload_port if needed (blank for auto-detect).
;   - Clock: 8 MHz internal RC as built (LFUSE=0xE2).  If an external 8 MHz
;     crystal is fitted, use LFUSE=0xF7; F_CPU stays 8000000L.
;     HFUSE=0xD7 (JTAG off, SPIEN on, EEPROM retained), EFUSE=0xFD (BOD 2.7 V).
;     See docs/hardware.md and docs/build.md.
;   - JTAG is disabled through MCUCR on the ATmega644P/PA (not MCUCSR).
;   - No SD card in this project; all assets live in flash.

[platformio]
default_envs = ATmega644PA

[env:ATmega644PA]
platform = atmelavr
board = ATmega644P
board_build.mcu = atmega644pa
board_build.f_cpu = 8000000L
framework = arduino
upload_protocol = usbasp
upload_flags =
    -e
build_flags =
    -Os
    -flto
    -ffunction-sections
    -fdata-sections
    -fno-exceptions
    -fno-rtti
    -fno-threadsafe-statics
    -Wl,--gc-sections
    -I src
